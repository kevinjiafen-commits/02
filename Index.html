<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>我的页面</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  background:#0d0d0d;color:#e8e8e8;min-height:100vh;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  text-align:center;padding:40px 20px;
}
h1{font-size:2rem;letter-spacing:2px;margin-bottom:8px}
.subtitle{color:#888;font-size:.9rem;margin-bottom:40px}
.stats{display:flex;gap:36px;margin-bottom:40px;flex-wrap:wrap;justify-content:center}
.stat-num{font-size:2rem;font-weight:700;color:#4da6ff;line-height:1.2}
.stat-label{font-size:.75rem;color:#666;text-transform:uppercase;letter-spacing:1px;margin-top:4px}
.tags{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;margin-bottom:40px}
.tag{border:1px solid #2a2a2a;color:#aaa;padding:6px 14px;border-radius:20px;font-size:.8rem}
.cta{
  display:inline-block;background:#4da6ff;color:#000;text-decoration:none;
  padding:14px 36px;border-radius:8px;font-weight:700;font-size:1rem;margin-bottom:18px;
}
.contact{color:#666;font-size:.85rem}
.contact a{color:#4da6ff;text-decoration:none}
</style>
</head>
<body>

<h1>你的产品名称</h1>
<p class="subtitle">一句话介绍你的页面</p>

<div class="stats">
  <div><div class="stat-num">7</div><div class="stat-label">Live</div></div>
  <div><div class="stat-num">40</div><div class="stat-label">Views</div></div>
  <div><div class="stat-num">8</div><div class="stat-label">Likes</div></div>
</div>

<div class="tags">
  <span class="tag">关键词一</span>
  <span class="tag">关键词二</span>
  <span class="tag">关键词三</span>
</div>

<a class="cta" href="https://你的链接" target="_blank">主要按钮</a>
<p class="contact">联系方式：<a href="https://你的链接">点这里</a></p>

</body>
  </html>
